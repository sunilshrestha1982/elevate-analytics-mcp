version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elevate_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    command: npm run start
    depends_on:
      - postgres
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      NODE_ENV: production
      APP_VERSION: 0.1.0
      LOG_LEVEL: info
      ALLOWED_ORIGINS: http://localhost:8080
      TRUST_PROXY: 'true'
      RATE_LIMIT_PER_MINUTE: 300
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/elevate_analytics?schema=public
      GOOGLE_REDIRECT_URI: http://localhost:8080/oauth/google/callback
      JWT_SECRET: replace-with-a-long-random-secret
      SESSION_SECRET: replace-with-a-long-random-secret
      ENCRYPTION_KEY: replace-with-a-32-character-key
      MCP_API_KEY: replace-with-a-long-random-api-key
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/live']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
