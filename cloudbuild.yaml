options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME: elevate-analytics-mcp
  _REGION: us-central1
  _REPOSITORY: elevate-analytics
  _IMAGE_TAG: latest
  _PLATFORM: managed
  _GOOGLE_REDIRECT_URI: ''
  _ALLOWED_ORIGINS: ''
  _SECRETS: DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,SESSION_SECRET=session-secret:latest,ENCRYPTION_KEY=encryption-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,MCP_API_KEY=mcp-api-key:latest
  _ALLOW_UNAUTHENTICATED: "false"

timeout: 1800s

steps:
  - name: node:22
    entrypoint: bash
    args:
      - -lc
      - |
        npm ci
        npm run lint
        npm run build
        npm test

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud artifacts repositories describe "${_REPOSITORY}" \
          --location="${_REGION}" >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_REPOSITORY}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="Artifact Registry for ${_SERVICE_NAME}" \
          --quiet
    id: ensure-artifact-registry

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=${_PLATFORM}
      - --port=8080
      - --set-env-vars=^~^NODE_ENV=production~PORT=8080~GCP_PROJECT_ID=$PROJECT_ID~GCP_REGION=${_REGION}~GCP_SERVICE_NAME=${_SERVICE_NAME}~GOOGLE_REDIRECT_URI=${_GOOGLE_REDIRECT_URI}~ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      - --set-secrets=${_SECRETS}
      - --no-allow-unauthenticated

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        if [[ "${_ALLOW_UNAUTHENTICATED}" == "true" ]]; then
          gcloud run services add-iam-policy-binding "${_SERVICE_NAME}" \
            --region "${_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker"
        fi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}
